[].forEach.call(document.querySelectorAll(".age"),function(a){
  a.href=urlFor(a.dataset.age);
  a.addEventListener("pointermove",function(e){var r=a.getBoundingClientRect();a.style.setProperty("--mx",(e.clientX-r.left)+"px");a.style.setProperty("--my",(e.clientY-r.top)+"px")});
  a.addEventListener("click",function(e){
    e.preventDefault(); if(box.classList.contains("busy"))return;
    var r=a.getBoundingClientRect(),s=r.width,p=document.createElement("span");p.className="ripple";p.style.width=p.style.height=s+"px";
    p.style.left=((e.clientX||r.left+r.width/2)-r.left-s/2)+"px";p.style.top=((e.clientY||r.top+r.height/2)-r.top-s/2)+"px";a.appendChild(p);
    a.querySelector(".go svg").innerHTML='<path d="M21 12a9 9 0 1 1-6.2-8.6"/>';
    a.classList.add("picked");box.classList.add("busy");try{navigator.vibrate&&navigator.vibrate(12)}catch(x){}
    setTimeout(function(){location.href=a.href},260);
  });
});
/* вернулся «назад» из оффера — сбросить состояние */
addEventListener("pageshow",function(e){if(e.persisted){box.classList.remove("busy");[].forEach.call(document.querySelectorAll(".age.picked"),function(a){a.classList.remove("picked");a.querySelector(".go svg").innerHTML='<path d="M5 12h14M13 6l6 6-6 6"/>'})}});

/* язык: ?lang= > кэш > гео > браузер */
var force=(qs.get("lang")||"").toLowerCase(),cached=null;try{cached=sessionStorage.getItem("pl3")}catch(e){}
if(T[force]){apply(force);reveal()}
else if(T[cached]){apply(cached);reveal()}
else{var done=false,fin=function(l){if(done)return;done=true;apply(l);try{sessionStorage.setItem("pl3",l)}catch(e){}reveal()};
  setTimeout(function(){fin(blang())},GEO_TIMEOUT);
  getJSON("https://api.country.is/",GEO_TIMEOUT).then(function(j){fin(pick(j.country))})
   .catch(function(){return getJSON("https://get.geojs.io/v1/ip/country.json",GEO_TIMEOUT).then(function(j){fin(pick(j.country))})})
   .catch(function(){fin(blang())});}

/* золотая пыль */
if(matchMedia("(prefers-reduced-motion: reduce)").matches)return;
var cv=document.getElementById("dust"),cx=cv.getContext("2d"),P=[],W,H,dpr=Math.min(devicePixelRatio||1,2);
function size(){W=cv.width=innerWidth*dpr;H=cv.height=innerHeight*dpr;cv.style.width=innerWidth+"px";cv.style.height=innerHeight+"px"}
size();addEventListener("resize",size);
for(var i=0;i<(innerWidth<600?24:44);i++)P.push({x:Math.random(),y:Math.random(),r:Math.random()*1.8+.5,s:Math.random()*.0003+.0001,a:Math.random()*6.3});
(function loop(){cx.clearRect(0,0,W,H);
  for(var i=0;i<P.length;i++){var p=P[i];p.y-=p.s;p.a+=.015;if(p.y<-.03){p.y=1.03;p.x=Math.random()}
    var x=(p.x+Math.sin(p.a)*.008)*W,y=p.y*H,r=p.r*dpr*3,o=.3+Math.sin(p.a*1.6)*.25,g=cx.createRadialGradient(x,y,0,x,y,r);
    g.addColorStop(0,"rgba(255,226,150,"+o+")");g.addColorStop(1,"rgba(255,226,150,0)");cx.fillStyle=g;cx.beginPath();cx.arc(x,y,r,0,7);cx.fill()}
  requestAnimationFrame(loop)})();
})();
</script>
